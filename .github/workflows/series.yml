name: Update series artwork

on:
  schedule:
    - cron: "17 0 * * *" # every day at 05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the contribution reel and continue-watching card
        run: python scripts/generate.py live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update series artwork"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
